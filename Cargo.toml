[package]
name         = "cafe"
version      = "0.0.2"
edition      = "2021"
rust-version = "1.77"
description  = "Keep your Mac or PC awake, from the tray"
authors      = ["kidchenko <kidchenko@gmail.com>"]
license      = "MIT"
repository   = "https://github.com/kidchenko/cafe"

[[bin]]
name = "cafe"
path = "src/main.rs"

[dependencies]
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
# Already in the tree via tray-icon; decodes the menu's glyphs (src/art.rs).
png        = "0.18"
tao        = "0.37"
tray-icon  = "0.26"

# ---------------------------------------------------------------------------
# Windows
# ---------------------------------------------------------------------------
[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8"

[target.'cfg(windows)'.dependencies.windows]
version  = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_WindowsAndMessaging",
]

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# ---------------------------------------------------------------------------
# macOS
# ---------------------------------------------------------------------------
# The power assertion itself is plain IOKit/CoreFoundation FFI (see awake.rs).
# `libc` is for localtime_r in the log stamp. objc2 is already in the tree via
# tao and tray-icon; ServiceManagement is for run-at-login (see autostart.rs),
# and AppKit for the running apps and the app picker (procs.rs, picker.rs).
[target.'cfg(target_os = "macos")'.dependencies]
libc                     = "0.2"
objc2                    = "0.6"
objc2-app-kit            = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage", "NSMenu", "NSMenuItem", "NSOpenPanel", "NSPanel", "NSResponder", "NSRunningApplication", "NSSavePanel", "NSWindow", "NSWorkspace"] }
objc2-foundation         = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSBundle", "NSError", "NSFileManager", "NSRunLoop", "NSString", "NSURL"] }
objc2-service-management = { version = "0.3", default-features = false, features = ["std", "SMAppService", "objc2", "objc2-foundation"] }

[profile.release]
opt-level     = "z"
lto           = true
codegen-units = 1
panic         = "abort"
strip         = true
