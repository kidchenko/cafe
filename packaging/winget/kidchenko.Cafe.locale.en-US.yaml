ShortDescription: Keep your PC awake from the tray
Description: |-
  A coffee cup in the notification area that keeps Windows from going to sleep,
  like PowerToys Awake without the rest of PowerToys.

  Keep your PC awake for as long as you like, for a set time, until a time of
  day, or while an app is open, with the screen on too if you want. Left-click
  the cup to switch it on or off. Cafe never changes your power plan. It just
  asks Windows not to sleep, and that request goes away when Cafe stops.
