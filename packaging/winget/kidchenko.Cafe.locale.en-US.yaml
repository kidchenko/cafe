ShortDescription: Keep your PC awake from the tray
Description: |-
  A coffee cup in the notification area that keeps Windows from going to sleep,
  like PowerToys Awake without the rest of PowerToys.

  Keep awake indefinitely, for a set time, or until a time of day, optionally
  with the screen kept on too. Left-click the cup to toggle. Switch it off and
  your normal power plan applies: Cafe never edits the plan, it only asks
  Windows not to sleep, and that request ends when Cafe stops.
